[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradikg-bot"
version = "0.1.0"
description = "Lokal betreibbarer, KI-gestützter Trading-Bot (Sprint 1: Daten, Kosten, Baseline-Strategie, Backtesting). Nur virtueller Handel."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
# Kostenlose Datenquellen – optional, weil sie Netzwerkzugriff benötigen.
data = [
    "ccxt>=4.2",
    "yfinance>=0.2.40",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
tradikg = "tradikg_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["tradikg_bot"]
known-local-folder = ["conftest", "helpers", "live_helpers", "market_fakes", "edge_data"]
